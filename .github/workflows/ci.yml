name: Project CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: node scripts/check-source.cjs
      - run: node scripts/check-dependencies.cjs
      - run: npm test -- --ci --runInBand
      - run: npm audit --audit-level=moderate
      - name: Compile Android and iOS JavaScript with empty config fixture
        run: node scripts/ci-bundle.cjs

  functions:
    name: Functions checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: node --check functions/index.js
      # Existing moderate uuid findings remain visible; high/critical fail CI.
      - run: npm audit --prefix functions --audit-level=high
