name: Deploy Firebase Functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: firebase-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Validate deployment configuration
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test "$PROJECT_ID" = "nsrit-school-2b749" || { echo 'Project must match hardcoded function and Data Connect configuration'; exit 1; }
          test -n "$WIF_PROVIDER" && test -n "$SERVICE_ACCOUNT" || { echo 'Missing workload identity configuration'; exit 1; }
      - run: npm ci --prefix functions
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy only the existing callable function
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: npx -y firebase-tools@15.34.1 deploy --only functions:setUserClaims --project "$PROJECT_ID" --non-interactive
